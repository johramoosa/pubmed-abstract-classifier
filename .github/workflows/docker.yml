name: Docker build

# Run automatically on pushes and pull requests.
# Also allow manual runs from GitHub's Actions tab.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download repository files
        uses: actions/checkout@v6

      - name: Set up Docker builder
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: abstract-classifier:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max